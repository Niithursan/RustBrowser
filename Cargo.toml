[package]
name = "rust-browser"
version = "0.22.2"
edition = "2024"
description = "An experimental web browser for Windows and Linux built with Wry and winit"
license = "MIT"
homepage = "https://github.com/Niithursan/RustBrowser"
repository = "https://github.com/Niithursan/RustBrowser"

# The Linux .deb, built with cargo-deb (`cargo deb`; CI pins its version). The
# Arch package is packaging/linux/arch/PKGBUILD; both install the same files.
[package.metadata.deb]
maintainer = "Rust Browser developers"
copyright = "Rust Browser developers"
license-file = ["LICENSE", "0"]
extended-description = """\
A lightweight desktop web browser built in Rust on WebKitGTK, with tabs, \
vertical tabs, a library of bookmarks, history and downloads, private windows, \
separate profiles, a built-in ad blocker and saved passwords in the desktop \
keyring."""
section = "web"
priority = "optional"
# $auto adds the libraries the program links to (WebKitGTK, GTK, libsoup,
# libsecret). winit loads the X11 keyboard and XCB libraries at run time, so
# they are named here.
depends = "$auto, libxkbcommon-x11-0, libx11-xcb1"
suggests = "gnome-keyring"
assets = [
    ["target/release/rust-browser", "usr/bin/", "755"],
    ["packaging/linux/rust-browser.desktop", "usr/share/applications/", "644"],
    ["packaging/windows/rust-browser.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/rust-browser/", "644"],
]

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
dunce = "1"

[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30"
wry = "0.57.1"
gtk = "0.18"
# 2.40: calling a function in the form helper's own script world.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# Reading the form helper's messages; already used by wry.
javascriptcore-rs = "1.1"
# Both already come with wry; used to shape the views' X11 windows.
gdkx11 = "0.18"
x11-dl = "2.21"
# The desktop keyring (Secret Service) for saved passwords and form data; the
# release on the same glib as gtk 0.18.
libsecret = { version = "0.4", features = ["v0_19"] }
# Downloading the built-in ad blocker's list; already used by webkit2gtk and wry.
soup3 = "0.5"

[target.'cfg(windows)'.dependencies]
winit = "0.30"
wry = "0.57.1"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi"] }
# Unpacking the uBlock Origin copy that comes with the browser (a deflated ZIP).
miniz_oxide = "0.9.1"

[dev-dependencies]
# Checking the bundled uBlock Origin ZIP against its pinned SHA-256; already in
# the lockfile through wry.
sha2 = "0.10"
