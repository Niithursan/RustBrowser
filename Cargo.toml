[package]
name = "rust-browser"
version = "0.1.0"
edition = "2024"
description = "An experimental Windows browser built with Wry and winit"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
winit = "0.30"
wry = "0.57.1"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
