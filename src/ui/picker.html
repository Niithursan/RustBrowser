<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Who's browsing?</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<style>
/* The profile picker shown at launch when there is more than one profile. Same
   Graphite tokens as the toolbar; the theme is the Default profile's. */
:root{--strip:#131518;--surface:#1E2228;--panel:#191C21;--card:#272C34;--text:#E9ECEF;--secondary:#9AA5B1;--line:#3A414B;--error:#FF9B8F;--accent:#F2C94C;--hover:rgba(233,236,239,.07);--pressed:rgba(233,236,239,.14);--display:'Segoe UI Variable Display','Segoe UI',sans-serif;--ui:'Segoe UI Variable Text','Segoe UI',sans-serif}
body[data-theme=slate]{--strip:#141C23;--surface:#1F2A33;--panel:#1A232B;--card:#2A3742;--line:#3D4D5A;--accent:#7CC4E4}
body[data-theme=plum]{--strip:#1B1420;--surface:#2A2130;--panel:#231B29;--card:#382C40;--line:#4C3D56;--accent:#E3B5FF}
body[data-theme=light]{color-scheme:light;--strip:#D9DEE3;--surface:#EEF0F2;--panel:#F8F9FA;--card:#E2E6EA;--text:#1B2430;--secondary:#4A5563;--line:#A7B0BA;--error:#A3192A;--accent:#2446B8;--hover:rgba(27,36,48,.06);--pressed:rgba(27,36,48,.12)}
body:not([data-theme=light]){color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 24px;background:var(--surface);color:var(--text);font:14px/1.4 var(--ui);user-select:none}
h1{margin:0;font:600 26px/1.15 var(--display);letter-spacing:-.01em}
#list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:560px;margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .12s,border-color .12s}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;width:124px;padding:16px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tile:hover{background:var(--card)}.tile:active{background:var(--pressed)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;color:#fff;font:600 24px/1 var(--display)}
.add .avatar{background:transparent;border:1px dashed var(--secondary);color:var(--secondary);font-weight:400}
.name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#error{min-height:20px;margin:0;color:var(--error)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style></head>
<body data-theme="dark">
<h1 id="title">Who's browsing?</h1>
<ul id="list" aria-labelledby="title"></ul>
<p id="error" role="alert"></p>
<script>
const data=/*DATA*/null;
document.body.dataset.theme=data.theme;
const send=(action,value)=>window.ipc.postMessage(JSON.stringify(value===undefined?{action}:{action,value}));
const list=document.getElementById('list');
function tile(name,make,onclick,cls){const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.className='tile'+(cls?' '+cls:'');const a=document.createElement('span');a.className='avatar';a.setAttribute('aria-hidden','true');make(a);const n=document.createElement('span');n.className='name';n.textContent=name;b.append(a,n);b.onclick=onclick;li.append(b);list.append(li);return b}
for(const p of data.profiles){tile(p.name,a=>{a.style.background=p.color;a.textContent=[...p.name.trim()][0]?.toUpperCase()||'?'},()=>send('open',p.id)).title='Open '+p.name}
if(data.can_add)tile('Add profile',a=>{a.textContent='+'},()=>send('add'),'add');
window.showError=text=>{document.getElementById('error').textContent=text};
document.addEventListener('keydown',e=>{if(e.key==='Escape')send('close')});
// Arrow keys move between tiles.
list.addEventListener('keydown',e=>{const tiles=[...list.querySelectorAll('button')];const at=tiles.indexOf(document.activeElement);const step=e.key==='ArrowRight'||e.key==='ArrowDown'?1:e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:0;if(step&&at>=0){e.preventDefault();tiles[(at+step+tiles.length)%tiles.length].focus()}});
list.querySelector('button')?.focus();
</script></body></html>
