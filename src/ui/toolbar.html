<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Browser controls</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#17212f;color:#e8eef7;font:14px 'Segoe UI',sans-serif;overflow:hidden}
#tabrow{display:flex;align-items:center;gap:6px;padding:6px 12px 0;height:38px}#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin}
.tab{display:flex;flex-shrink:0;max-width:210px}.tab button{height:28px;border-radius:0}.tab .select{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}.tab.active .select{background:#385477}
form{display:flex;gap:6px;padding:8px 12px 6px;align-items:center}button,select{height:34px;min-width:34px;border:1px solid #425169;border-radius:6px;background:#243247;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus,select:focus{outline:2px solid #69b8ff}input{flex:1;min-width:50px;height:34px;border:1px solid #536882;border-radius:6px;background:#0d1623;color:white;padding:0 12px;font:inherit}
#status,#notice{padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#bacce0}#notice{color:#ffb4a8;height:17px}#status.error{color:#ffb4a8}select{max-width:112px;font:inherit}
#manager{position:absolute;top:136px;bottom:0;left:0;right:0;overflow:auto;background:#101b29;padding:20px 28px}#manager[hidden]{display:none}
.manager-head,.manager-tools,.row,.folder-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.manager-head{justify-content:space-between}h1{font-size:24px;margin:0 0 12px}h2{font-size:16px;margin:16px 0 8px}.manager-tools{padding:12px 0;border-bottom:1px solid #34445c}.manager-tools input{flex:initial;min-width:160px}.manager-tools input[type=date]{min-width:130px;width:150px}.manager-tools input[type=checkbox]{height:auto;min-width:0;width:auto}.manager-tools label{display:flex;align-items:center;gap:5px}
#bookmark-form{padding:12px 0;display:flex;flex-wrap:wrap}#bookmark-form input{min-width:200px}.folder-tools input{max-width:240px}.folder-tools select,#bookmark-form select,#folder-filter{max-width:180px}
.row{padding:14px 0;border-bottom:1px solid #34445c}.row .info{flex:1;min-width:200px;overflow-wrap:anywhere}.row .title{font-weight:600;display:block}.row .secondary{display:block;color:#a7bdd6;font-size:12px;margin-top:4px}.row button{padding:0 10px}.muted{color:#a7bdd6;font-size:12px}progress{width:160px}#library-links{display:flex;gap:4px}#library-links button{font-size:12px;padding:0 7px}
</style></head><body>
<div id="tabrow"><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new" type="button" title="New tab (Ctrl+T)" aria-label="New tab">+</button><div id="library-links"><button type="button" id="show-bookmarks">Bookmarks</button><button type="button" id="show-history">History</button><button type="button" id="show-downloads">Downloads</button></div></div>
<form id="nav"><button type="button" id="back" title="Back (Alt+Left)" aria-label="Back" disabled>←</button><button type="button" id="forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>→</button><button type="button" id="reload" title="Reload (Ctrl+R / F5)" aria-label="Reload">↻</button><button type="button" id="stop" title="Stop (Escape)" aria-label="Stop">×</button><button type="button" id="home" title="Home" aria-label="Home">⌂</button><input id="address" aria-label="Website address or search" placeholder="Search or enter address" autocomplete="off" spellcheck="false"><select id="search" aria-label="Default search engine"><option value="google">Google</option><option value="duck_duck_go">DuckDuckGo</option><option value="bing">Bing</option></select><button type="submit">Go</button></form>
<div id="status" role="status" aria-live="polite">Starting Rust Browser…</div><div id="notice" role="status" aria-live="polite"></div>
<section id="manager" hidden aria-label="Browser library">
<div class="manager-head"><h1 id="manager-title">Bookmarks</h1><button type="button" id="close-manager">Back to page (F7)</button></div>
<p id="manager-description" class="muted"></p>
<div id="library-tools" class="manager-tools"><input id="library-query" aria-label="Search library" placeholder="Search titles and URLs" maxlength="512"><select id="folder-filter" aria-label="Filter bookmark folder"></select><label class="history-only">From <input id="history-from" type="date" aria-label="History from date"></label><label class="history-only">Through <input id="history-until" type="date" aria-label="History through date"></label><button type="button" id="refresh-library">Search / refresh</button><label class="history-only"><input id="history-enabled" type="checkbox">Record history</label><button type="button" id="clear-history" class="history-only">Clear all history…</button></div>
<div id="bookmark-editor"><h2>Add or edit bookmark</h2><form id="bookmark-form"><input id="bookmark-id" type="hidden"><input id="bookmark-title" aria-label="Bookmark title" placeholder="Title" maxlength="256" required><input id="bookmark-url" aria-label="Bookmark URL" placeholder="https://example.com/" maxlength="8192" required><select id="bookmark-folder" aria-label="Bookmark folder"></select><button type="submit">Save bookmark</button><button type="button" id="reset-bookmark">New bookmark</button></form>
<div class="folder-tools"><select id="edit-folder" aria-label="Choose folder to edit"></select><input id="folder-name" aria-label="Folder name" placeholder="Folder name" maxlength="80"><button type="button" id="save-folder">Save folder</button><button type="button" id="remove-folder">Remove folder</button><span class="muted">Removing a folder keeps its bookmarks in Unfiled.</span></div></div>
<div id="library-results" aria-live="polite"></div><div id="download-results" aria-live="polite"></div>
</section>
<script>
const input=document.getElementById('address'),status=document.getElementById('status'),tabs=document.getElementById('tabs');
const byId=id=>document.getElementById(id);
let currentPanel=null,librarySignature='',downloadSignature='',libraryData={folders:[],bookmarks:[],history:[]};
for(const panel of ['bookmarks','history','downloads'])byId('show-'+panel).onclick=()=>send('show_panel',panel);
byId('close-manager').onclick=()=>send('close_panel');
function queryLibrary(){
    const from=byId('history-from').valueAsNumber,until=byId('history-until').valueAsNumber;
    send('query_library',{query:byId('library-query').value,folder:byId('folder-filter').value===''?null:Number(byId('folder-filter').value),from:Number.isFinite(from)?from/1000:null,until:Number.isFinite(until)?until/1000+86400:null});
}
let queryTimer;byId('library-query').oninput=()=>{clearTimeout(queryTimer);queryTimer=setTimeout(queryLibrary,300)};
for(const id of ['folder-filter','history-from','history-until'])byId(id).onchange=queryLibrary;
byId('refresh-library').onclick=queryLibrary;
byId('history-enabled').onchange=e=>send('set_history_enabled',e.target.checked);
byId('clear-history').onclick=()=>{if(window.confirm('Clear all browsing history? This cannot be undone. Bookmarks, cookies and native back/forward history are kept.'))send('library',{kind:'clear_history',confirmed:true})};
byId('bookmark-form').onsubmit=e=>{e.preventDefault();send('library',{kind:'save_bookmark',id:byId('bookmark-id').value?Number(byId('bookmark-id').value):null,title:byId('bookmark-title').value,url:byId('bookmark-url').value,folder:byId('bookmark-folder').value?Number(byId('bookmark-folder').value):null})};
byId('reset-bookmark').onclick=()=>{byId('bookmark-form').reset();byId('bookmark-id').value=''};
byId('edit-folder').onchange=e=>{byId('folder-name').value=libraryData.folders.find(f=>f.id===Number(e.target.value))?.name||''};
byId('save-folder').onclick=()=>send('library',{kind:'save_folder',id:byId('edit-folder').value?Number(byId('edit-folder').value):null,name:byId('folder-name').value});
byId('remove-folder').onclick=()=>{const id=Number(byId('edit-folder').value);if(id)send('library',{kind:'remove_folder',id})};
function button(label,action){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=action;return b}
function infoRow(title,secondary){const row=document.createElement('div');row.className='row';const info=document.createElement('div');info.className='info';const t=document.createElement('span');t.className='title';t.textContent=title;const sub=document.createElement('span');sub.className='secondary';sub.textContent=secondary;info.append(t,sub);row.append(info);return row}
function folderOptions(id,first,folders){const select=byId(id),value=select.value;select.replaceChildren();for(const [value,label] of first.concat(folders.map(f=>[String(f.id),f.name]))){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option)}if([...select.options].some(o=>o.value===value))select.value=value}
function renderLibrary(data,panel){
    libraryData=data;
    folderOptions('folder-filter',[['','All folders'],['0','Unfiled']],data.folders);
    folderOptions('bookmark-folder',[['','Unfiled']],data.folders);
    folderOptions('edit-folder',[['','New folder']],data.folders);
    const list=byId('library-results');list.replaceChildren();
    const rows=panel==='history'?data.history:data.bookmarks;
    if(!rows.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No matching entries.';list.append(empty)}
    for(const item of rows){
        const detail=panel==='history'?new Date(item.timestamp*1000).toLocaleString()+' · '+item.url:((data.folders.find(f=>f.id===item.folder)?.name||'Unfiled')+' · '+item.url);
        const row=infoRow(item.title||item.url,detail);
        row.append(button('Open',()=>send('open_saved',{url:item.url,new_tab:false})),button('New tab',()=>send('open_saved',{url:item.url,new_tab:true})));
        if(panel==='bookmarks')row.append(button('Edit',()=>{byId('bookmark-id').value=item.id;byId('bookmark-title').value=item.title;byId('bookmark-url').value=item.url;byId('bookmark-folder').value=item.folder??'';byId('bookmark-title').focus()}));
        row.append(button('Remove',()=>send('library',{kind:panel==='history'?'remove_visit':'remove_bookmark',id:item.id})));list.append(row);
    }
}
const downloadNodes=new Map();
function renderDownloads(records){
    const list=byId('download-results');
    if(!records.length){list.textContent='No downloads in this browser session.';return}
    if(!downloadNodes.size)list.replaceChildren();
    const ids=new Set(records.map(item=>item.id));
    for(const [id,node] of downloadNodes){if(!ids.has(id)){node.row.remove();downloadNodes.delete(id)}}
    for(const item of [...records].reverse()){
        let node=downloadNodes.get(item.id);
        if(!node){
            const row=infoRow('',''),bar=document.createElement('progress');
            const cancel=button('Cancel',()=>send('cancel_download',item.id)),folder=button('Open folder',()=>send('open_download_folder',item.id));
            row.append(bar,cancel,folder);node={row,bar,cancel,folder};downloadNodes.set(item.id,node);list.prepend(row);
        }
        const progress=item.total>0?Math.min(100,Math.round(item.received/item.total*100))+'% ('+item.received+' / '+item.total+' bytes)':item.received+' bytes';
        node.row.querySelector('.title').textContent=item.name;
        node.row.querySelector('.secondary').textContent=item.status+' · '+progress+(item.detail?' · '+item.detail:'')+(item.path?' · '+item.path:'');
        const active=['Choose destination','Downloading','Cancelling'].includes(item.status);
        node.bar.hidden=!active;node.cancel.hidden=!active;node.cancel.disabled=item.status==='Cancelling';node.folder.hidden=!item.folder;
        if(item.total>0){node.bar.max=item.total;node.bar.value=item.received}else{node.bar.removeAttribute('value')}
    }
}
let editing=false,activeId=null,tabSignature='';
function send(action,value){window.ipc.postMessage(JSON.stringify({action,value}));}
for(const action of ['back','forward','reload','stop','home'])document.getElementById(action).onclick=()=>send(action);
document.getElementById('new').onclick=()=>send('new_tab');
document.getElementById('search').onchange=e=>send('set_search_engine',e.target.value);
document.getElementById('nav').onsubmit=e=>{e.preventDefault();editing=false;send('navigate',input.value)};
input.onfocus=()=>editing=true;input.onblur=()=>editing=false;
window.focusAddress=()=>{input.focus();input.select();editing=true};
window.render=s=>{
    const changedPanel=currentPanel!==s.panel;currentPanel=s.panel;
    byId('manager').hidden=!s.panel;
    if(s.panel){
        byId('manager-title').textContent={bookmarks:'Bookmarks',history:'Browsing history',downloads:'Downloads'}[s.panel];
        byId('manager-description').textContent=s.panel==='bookmarks'?'Save and organize pages. Search shows up to 200 entries.':s.panel==='history'?'Successful visits only. Query-string URLs and credentials are excluded; fragments are stripped. Dates use UTC days; timestamps display locally. Up to 200 results.':'Choose a destination folder for each file. Existing files are kept. Downloaded files are never opened automatically. Records last for this browser session.';
        byId('library-tools').hidden=s.panel==='downloads';byId('bookmark-editor').hidden=s.panel!=='bookmarks';byId('library-results').hidden=s.panel==='downloads';byId('download-results').hidden=s.panel!=='downloads';byId('folder-filter').hidden=s.panel!=='bookmarks';
        for(const element of document.querySelectorAll('.history-only'))element.hidden=s.panel!=='history';
        byId('history-enabled').checked=s.history_enabled;
        if(changedPanel){byId('library-query').value='';byId('history-from').value='';byId('history-until').value='';byId('folder-filter').value='';}
        const signature=s.panel+JSON.stringify(s.library);if(signature!==librarySignature||changedPanel){librarySignature=signature;renderLibrary(s.library,s.panel)}
        const downloads=JSON.stringify(s.downloads);if(downloads!==downloadSignature||changedPanel){downloadSignature=downloads;renderDownloads(s.downloads)}
    }
    if(activeId!==s.active_id){editing=false;activeId=s.active_id;}
    if(!editing)input.value=s.url;
    document.getElementById('back').disabled=!s.back;document.getElementById('forward').disabled=!s.forward;document.getElementById('stop').disabled=!s.loading;
    status.textContent=s.message;status.className=s.message.startsWith('Error:')?'error':'';
    document.getElementById('notice').textContent=s.notice;document.getElementById('search').value=s.search_engine;
    const signature=JSON.stringify(s.tabs);
    if(signature!==tabSignature){
        tabSignature=signature;tabs.replaceChildren();
        for(const tab of s.tabs){
            const item=document.createElement('div');item.className='tab'+(tab.active?' active':'');
            const select=document.createElement('button');select.type='button';select.className='select';select.setAttribute('role','tab');select.setAttribute('aria-selected',String(tab.active));
            select.textContent=tab.title||'New tab';select.title=tab.title;select.onclick=()=>send('select_tab',tab.id);
            const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','Close tab '+tab.title);close.onclick=()=>send('close_tab',tab.id);
            item.append(select,close);tabs.append(item);if(tab.active)item.scrollIntoView({block:'nearest',inline:'nearest'});
        }
    }
};
send('ready');
</script></body></html>
