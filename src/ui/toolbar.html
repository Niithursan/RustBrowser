<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#17212f;color:#e8eef7;font:14px 'Segoe UI',sans-serif;overflow:hidden}form{display:flex;gap:6px;padding:12px 12px 6px;align-items:center}button{height:34px;min-width:36px;border:1px solid #425169;border-radius:6px;background:#243247;color:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus{outline:2px solid #69b8ff}input{flex:1;min-width:50px;height:34px;border:1px solid #536882;border-radius:6px;background:#0d1623;color:white;padding:0 12px;font:inherit}#status{padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#bacce0}#status.error{color:#ffb4a8}.hint{opacity:.65;margin-left:10px;font-size:11px}
</style></head><body>
<form id="nav"><button type="button" id="back" title="Back (Alt+Left)" aria-label="Back" disabled>←</button><button type="button" id="forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>→</button><button type="button" id="reload" title="Reload (Ctrl+R / F5)" aria-label="Reload">↻</button><button type="button" id="stop" title="Stop (Escape)" aria-label="Stop">×</button><button type="button" id="home" title="Home" aria-label="Home">⌂</button><input id="address" aria-label="Website address" placeholder="Enter a website address" autocomplete="off" spellcheck="false"><button type="submit">Go</button></form>
<div id="status" role="status" aria-live="polite">Starting Rust Browser…</div>
<script>
const input=document.getElementById('address'),status=document.getElementById('status');
let editing=false;
function send(action,value){window.ipc.postMessage(JSON.stringify({action,value}));}
for(const action of ['back','forward','reload','stop','home'])document.getElementById(action).onclick=()=>send(action);
document.getElementById('nav').onsubmit=e=>{e.preventDefault();editing=false;send('navigate',input.value)};
input.onfocus=()=>editing=true;input.onblur=()=>editing=false;
window.focusAddress=()=>{input.focus();input.select();editing=true};
window.render=s=>{if(!editing)input.value=s.url;document.getElementById('back').disabled=!s.back;document.getElementById('forward').disabled=!s.forward;document.getElementById('stop').disabled=!s.loading;status.textContent=s.message;status.className=s.message.startsWith('Error:')?'error':'';};
send('ready');
</script></body></html>
