name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Pinned so the cached binary can never silently go stale; bump deliberately.
  CARGO_AUDIT_VERSION: 0.22.2
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      # Cache only the cargo-audit binary built from crates.io source on this
      # runner; the advisory database is always fetched fresh by `cargo audit`.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-tool
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Verify cargo-audit version
        run: |
          actual="$(cargo audit --version)"
          echo "$actual"
          test "$actual" = "cargo-audit $CARGO_AUDIT_VERSION"
      - run: cargo audit --deny warnings
