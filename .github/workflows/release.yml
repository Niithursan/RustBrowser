name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing approved stable version tag (vX.Y.Z); must belong to main'
        required: true
        type: string
      publish:
        description: 'Explicitly publish the validated package as a GitHub Release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Validate release tag and ancestry
        id: validate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Use an approved stable version tag' }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata' }
          $version = ($metadata.packages | Where-Object name -eq 'rust-browser').version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match the Cargo version' }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne (git rev-parse HEAD)) { throw 'Checkout must match the existing tag commit' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release must belong to main history' }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Script and fixture regressions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\process_tree.ps1
          .\tests\servo_tools.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'release-servo-tools')
          python -m unittest discover -s experiments/servo -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Experimental fixture tests failed' }
          python -m unittest discover -s validation -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Production fixture tests failed' }
      - name: Native production regressions
        shell: powershell
        run: |
          foreach ($test in @('native_private_storage_and_confirmed_engine_deletion','native_application_clear','native_tab_sleep_resume_and_local_page_security','native_private_newtab_settings_are_ephemeral','native_popup_opener_upload_audio_fullscreen_and_redirects','native_renderer_crash_is_reported_and_reload_recovers','native_failure_reporting_tab_retirement_and_engine_restart','native_toolbar_engine_failure_is_recovered','native_toolbar_keyboard_reachability_and_scaled_layout','native_content_find_zoom_print_boundary','native_private_content_tools_are_ephemeral','native_address_field_edit_menu','native_multiple_windows_routing_limit_close_reopen_and_handoff','native_multiple_windows_engine_restart_toolbar_and_clearing','native_multiple_windows_restore_and_exit','native_passwords_and_autofill_follow_the_switches','native_private_windows_never_save_passwords_or_forms','native_bookmark_import_reaches_the_library','native_toolbar_autofill_is_cleared_once_on_upgrade','native_toolbar_autofill_cleanup_does_not_repeat','native_extensions_add_list_disable_remove_and_restart','native_private_windows_run_extensions_and_the_built_in_blocker','native_built_in_ublock_origin_blocks_and_turns_off','native_address_enter_navigates_without_a_go_button','native_address_suggestions_complete_and_list','native_toolbar_polish_states','native_menu_opens_as_a_dropdown','native_menu_keeps_the_new_tab_page_visible','native_back_to_the_start_of_a_new_tab_shows_the_new_tab_page','native_new_tabs_grow_into_the_tab_strip','native_tab_menu_and_middle_click','native_imported_bookmarks_show_on_the_bookmarks_bar','native_bookmark_menus','native_window_edges_resize','native_star_and_site_information_open_as_dropdowns','native_library_sidebar_beside_a_live_page','native_shield_counts_what_an_extension_blocks','native_shield_opens_the_extension_popup','native_shield_does_not_count_frames_from_other_sites','native_shield_panel_fits_a_narrow_window','native_side_views_have_the_toolbar_restrictions_and_recover','native_private_windows_follow_vertical_tabs_read_only','native_profiles_switch_add_edit_and_delete','native_vertical_tabs_in_two_windows','native_newtab_tiles_and_background','native_servo_comparison_fixture')) {
            cargo test --locked --bin rust-browser $test -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $test" }
          }
          foreach ($test in @('native_permission_prompt_over_the_page','native_private_permission_prompt_over_the_page','native_chrome_interactions')) {
            cargo test --locked --bin rust-browser $test -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $test" }
          }
          cargo test --locked --test single_instance -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native single-instance hand-off failed' }
          foreach ($attempt in 1..3) {
            .\validation\windows-daily.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP "release-daily-validation-$attempt")
          }
      # Keep release application builds clean/uncached. Only the pinned audit
      # tool is cached, with its version verified and advisories fetched fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-tool
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: release-cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Verify audit tool version
        shell: pwsh
        run: |
          $actual = cargo audit --version
          if ($LASTEXITCODE -ne 0 -or ($actual -split ' ')[-1] -cne '0.22.2') { throw 'Unexpected cargo-audit version' }
      - run: cargo audit --deny warnings
      - run: cargo build --locked --release
      - name: Validate installer and portable packages
        id: packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          .\tests\windows_package.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'release-portable-tests') -SourceCommit $commit
          $compiler = .\packaging\windows\install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'release-inno')
          $baseline = .\tests\build_install_baseline.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'release-install-baseline')
          "Baseline build seconds: $($baseline.build_seconds)"
          $output = .\tests\windows_installer.ps1 -Executable target/release/rust-browser.exe -BaselineExecutable $baseline.executable -OutputRoot (Join-Path $env:RUNNER_TEMP 'release-installer-tests') -Compiler $compiler -SourceCommit $commit
          $package = $output | Where-Object { $_ -isnot [string] -and $_.metadata } | Select-Object -Last 1
          $output | Where-Object { $_ -is [string] }
          if (-not $package) { throw 'No validated release package' }
          .\tests\release_metadata.ps1 -MetadataPath $package.metadata -OutputRoot (Join-Path $env:RUNNER_TEMP 'release-metadata-tests')
          "installer=$($package.installer)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.installer_checksum)" >> $env:GITHUB_OUTPUT
          "archive=$($package.archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.checksum)" >> $env:GITHUB_OUTPUT
          "metadata=$($package.metadata)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-package
          path: |
            ${{ steps.packages.outputs.archive }}
            ${{ steps.packages.outputs.checksum }}
            ${{ steps.packages.outputs.installer }}
            ${{ steps.packages.outputs.installer_checksum }}
            ${{ steps.packages.outputs.metadata }}
          if-no-files-found: error
  # The Ubuntu/Debian package, built uncached from the tag like the Windows
  # package and installed into a clean Ubuntu 24.04 container before upload.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: sh packaging/linux/check-release-tag.sh "$RELEASE_TAG"
      - name: Install WebKitGTK and GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libsecret-1-dev
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb --locked --no-build
      - name: Install the .deb on a clean Ubuntu 24.04
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c "
            apt-get update -q &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q desktop-file-utils /src/target/debian/*.deb &&
            sh /src/packaging/linux/check-installed.sh '$version'"
      - name: Name the package for the release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -- target/debian/*.deb
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then echo 'Expected exactly one .deb' >&2; exit 1; fi
          mkdir release
          name="rust-browser-$RELEASE_TAG-linux-amd64.deb"
          cp "$1" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-package
          path: release/*
          if-no-files-found: error
  # The Arch package from packaging/linux/arch/PKGBUILD, built from the tag
  # commit and installed in the same Arch container before upload. Arch is
  # rolling, so the image is updated first rather than pinned.
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: archlinux:base-devel
    steps:
      # Before checkout, which needs git for the tags pkgver() reads.
      - name: Update the image and install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git config --system --add safe.directory '*'
          sh packaging/linux/check-release-tag.sh "$RELEASE_TAG"
      - name: Install the PKGBUILD's dependencies
        shell: bash
        run: |
          . packaging/linux/arch/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" desktop-file-utils
      - name: Build the package as an ordinary user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "sh packaging/linux/arch/build-from-checkout.sh /home/builder/pkg"
      - name: Install and check the package
        run: |
          pacman -U --noconfirm /home/builder/pkg/rust-browser-git-*.pkg.tar.zst
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sh packaging/linux/check-installed.sh "$version"
      - name: Name the package for the release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -- /home/builder/pkg/rust-browser-git-*.pkg.tar.zst
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then echo 'Expected exactly one Arch package' >&2; exit 1; fi
          mkdir release
          name="rust-browser-$RELEASE_TAG-arch-x86_64.pkg.tar.zst"
          cp "$1" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-release-package
          path: release/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [package, linux, arch]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.release_tag }}
          persist-credentials: false
      - name: Publish explicitly approved GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          foreach ($artifact in @('windows-release-package', 'linux-release-package', 'arch-release-package')) {
            gh run download "$env:RUN_ID" --name $artifact --dir package
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the validated $artifact" }
          }
          $prefix = "rust-browser-$env:RELEASE_TAG-windows-x64"
          $deb = "rust-browser-$env:RELEASE_TAG-linux-amd64.deb"
          $arch = "rust-browser-$env:RELEASE_TAG-arch-x86_64.pkg.tar.zst"
          $names = @("$prefix.zip", "$prefix.zip.sha256", "$prefix-setup.exe", "$prefix-setup.exe.sha256", "$prefix-release.json", $deb, "$deb.sha256", $arch, "$arch.sha256")
          $actualNames = ((Get-ChildItem package -File).Name | Sort-Object) -join '|'
          if ($actualNames -cne (($names | Sort-Object) -join '|')) { throw 'Unexpected release artifact set' }
          $metadata = Join-Path package "$prefix-release.json"
          .\packaging\windows\verify-release.ps1 -MetadataPath $metadata -ArtifactDirectory package -CurrentVersion '0.0.0'
          $record = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
          if ($record.source_commit -cne (git rev-parse HEAD)) { throw 'Package source commit mismatch' }
          foreach ($name in @("$prefix.zip", "$prefix-setup.exe", $deb, $arch)) {
            $hash = (Get-FileHash -LiteralPath (Join-Path package $name)).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath (Join-Path package "$name.sha256") -Raw).Trim() -cne "$hash  $name") { throw 'Release artifact checksum mismatch' }
          }
          $assets = @($names | ForEach-Object { Join-Path package $_ })
          # Reviewed release notes from the tagged commit, never generated text.
          $notes = "release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Reviewed release notes $notes are missing" }
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --notes-file $notes --title "Rust Browser $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
