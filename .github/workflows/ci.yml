name: CI
# Validate pull requests and main. Feature-branch pushes no longer run a second,
# duplicate full validation: open a (draft) pull request to get CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR runs share a group so superseded pushes are cancelled. Every other run
  # (main pushes, manual dispatch) gets its own per-commit group: a shared group
  # would let GitHub drop a pending main run when a newer one queues.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  # Cheap Linux check that decides whether the Windows jobs are needed. Only a
  # change made entirely of unpackaged Markdown skips them; see .github/scripts/ci_scope.py.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the merge base of the whole pull request
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          # Whole pull request (base...head), or the commits a push to main added.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_scope.py scope

  windows:
    name: Windows quality and build
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Caches the registry and compiled dependencies only (workspace crates are
      # rebuilt). Key includes OS, rustc version, Cargo.lock and this job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Experimental launcher safety and fixture tests (no Servo download)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\process_tree.ps1
          .\tests\servo_tools.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-servo-tests')
          python -m unittest discover -s experiments/servo -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Experimental fixture tests failed' }
          python -m unittest discover -s validation -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Production fixture handshake tests failed' }
      # Separate processes: winit permits one event loop per process. These reuse
      # the test binary built by `cargo test` above.
      - name: Native WebView2 isolation and permissions
        run: cargo test --locked --bin rust-browser native_private_storage_and_confirmed_engine_deletion -- --ignored --test-threads=1
      - name: Native application clearing
        run: cargo test --locked --bin rust-browser native_application_clear -- --ignored --test-threads=1
      - name: Native sleeping tabs and local new-tab boundary
        run: cargo test --locked --bin rust-browser native_tab_sleep_resume_and_local_page_security -- --ignored --test-threads=1
      - name: Private new-tab isolation
        run: cargo test --locked --bin rust-browser native_private_newtab_settings_are_ephemeral -- --ignored --test-threads=1
      - name: Native linked popups, media and upload protection
        run: cargo test --locked --bin rust-browser native_popup_opener_upload_audio_fullscreen_and_redirects -- --ignored --test-threads=1
      - name: Native renderer crash and reload recovery
        run: cargo test --locked --bin rust-browser native_renderer_crash_is_reported_and_reload_recovers -- --ignored --test-threads=1
      - name: Native failure reporting, tab retirement and engine restart
        run: cargo test --locked --bin rust-browser native_failure_reporting_tab_retirement_and_engine_restart -- --ignored --test-threads=1
      - name: Native toolbar engine failure recovery
        run: cargo test --locked --bin rust-browser native_toolbar_engine_failure_is_recovered -- --ignored --test-threads=1
      - name: Native toolbar keyboard reachability and scaled layout
        run: cargo test --locked --bin rust-browser native_toolbar_keyboard_reachability_and_scaled_layout -- --ignored --test-threads=1
      - name: Native content find, zoom, print and toolbar boundary
        run: cargo test --locked --bin rust-browser native_content_find_zoom_print_boundary -- --ignored --test-threads=1
      - name: Native private content tools and persistence boundary
        run: cargo test --locked --bin rust-browser native_private_content_tools_are_ephemeral -- --ignored --test-threads=1
      - name: Controlled composition, scaling and frame comparison fixture
        run: cargo test --locked --bin rust-browser native_servo_comparison_fixture -- --ignored --test-threads=1 --nocapture
      - name: Native daily-driver compatibility, diagnostics and untrusted TLS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent fresh profiles; every run must pass. These are not retries.
          foreach ($attempt in 1..3) {
            .\validation\windows-daily.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP "rust-browser-daily-validation-$attempt")
          }
      - run: cargo build --locked

  # Independent of the quality job, so it runs in parallel on its own runner.
  release:
    name: Windows release build and package
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # exact pinned v0.14 upgrade fixture, never a mutable release download
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Old installer-fixture builds were nested in target and duplicated
          # in this cache. Start a separate production namespace after moving them.
          shared-key: v013-production-only
      - run: cargo build --locked --release
      - name: Portable package metadata, integrity and output safety
        shell: powershell
        run: |
          $commit = git rev-parse HEAD
          .\tests\windows_package.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-packaging-tests') -SourceCommit $commit
      - name: Cache immutable upgrade-fixture build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-browser-install-baseline/target-v014
          key: installer-fixture-v4-b4f0c2388a80853110baa9d43a8cec56a796d220-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - name: Installer lifecycle, profile preservation and artifact verification
        id: installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = .\packaging\windows\install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'rust-browser-inno')
          $baseline = .\tests\build_install_baseline.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-install-baseline')
          "Baseline build seconds: $($baseline.build_seconds)"
          $output = .\tests\windows_installer.ps1 -Executable target/release/rust-browser.exe -BaselineExecutable $baseline.executable -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-installer-tests') -Compiler $compiler -SourceCommit (git rev-parse HEAD)
          $package = $output | Where-Object { $_ -isnot [string] -and $_.metadata } | Select-Object -Last 1
          $output | Where-Object { $_ -is [string] }
          if (-not $package) { throw 'Installer tests returned no validated package' }
          .\tests\release_metadata.ps1 -MetadataPath $package.metadata -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-release-metadata')
          # Owner artifacts use a validation identity plus an explicit disposable
          # profile. Production CRT remains dynamic during the isolated experiment.
          .\tests\static_crt_build.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-crt-failure-tests')
          .\tests\owner_build.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-owner-tests') -Compiler $compiler -SourceCommit (git rev-parse HEAD) -ExpectedCrt dynamic
          "installer=$($package.installer)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.installer_checksum)" >> $env:GITHUB_OUTPUT
          "archive=$($package.archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.checksum)" >> $env:GITHUB_OUTPUT
          "metadata=$($package.metadata)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-windows-x64
          path: target/release/rust-browser.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-windows-review-packages
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.installer_checksum }}
            ${{ steps.installer.outputs.archive }}
            ${{ steps.installer.outputs.checksum }}
            ${{ steps.installer.outputs.metadata }}
          if-no-files-found: error

  # Single stable check name for branch protection if it is enabled later. It
  # succeeds only if the scope check passed and every job it required passed; a
  # documentation-only change reports success with both Windows jobs skipped.
  result:
    name: CI result
    needs: [scope, windows, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every needed CI job to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          WINDOWS: ${{ needs.windows.result }}
          RELEASE: ${{ needs.release.result }}
        run: python3 .github/scripts/ci_scope.py result "$SCOPE" "$FULL" "$WINDOWS" "$RELEASE"
