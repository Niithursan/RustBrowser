name: CI
# Validate pull requests and main. Feature-branch pushes no longer run a second,
# duplicate full validation: open a (draft) pull request to get CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every main commit is fully validated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  windows:
    name: Windows quality and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Caches the registry and compiled dependencies only (workspace crates are
      # rebuilt). Key includes OS, rustc version, Cargo.lock and this job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Experimental launcher safety and fixture tests (no Servo download)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\process_tree.ps1
          .\tests\servo_tools.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-servo-tests')
          python -m unittest discover -s experiments/servo -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Experimental fixture tests failed' }
          python -m unittest discover -s validation -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Production fixture handshake tests failed' }
      # Separate processes: winit permits one event loop per process. These reuse
      # the test binary built by `cargo test` above.
      - name: Native WebView2 isolation and permissions
        run: cargo test --locked --bin rust-browser native_private_storage_and_confirmed_engine_deletion -- --ignored --test-threads=1
      - name: Native application clearing
        run: cargo test --locked --bin rust-browser native_application_clear -- --ignored --test-threads=1
      - name: Native sleeping tabs and local new-tab boundary
        run: cargo test --locked --bin rust-browser native_tab_sleep_resume_and_local_page_security -- --ignored --test-threads=1
      - name: Private new-tab isolation
        run: cargo test --locked --bin rust-browser native_private_newtab_settings_are_ephemeral -- --ignored --test-threads=1
      - name: Native linked popups, media and upload protection
        run: cargo test --locked --bin rust-browser native_popup_opener_upload_audio_fullscreen_and_redirects -- --ignored --test-threads=1
      - name: Native renderer crash and reload recovery
        run: cargo test --locked --bin rust-browser native_renderer_crash_is_reported_and_reload_recovers -- --ignored --test-threads=1
      - name: Controlled composition, scaling and frame comparison fixture
        run: cargo test --locked --bin rust-browser native_servo_comparison_fixture -- --ignored --test-threads=1 --nocapture
      - name: Native daily-driver compatibility, diagnostics and untrusted TLS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent fresh profiles; every run must pass. These are not retries.
          foreach ($attempt in 1..3) {
            .\validation\windows-daily.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP "rust-browser-daily-validation-$attempt")
          }
      - run: cargo build --locked

  # Independent of the quality job, so it runs in parallel on its own runner.
  release:
    name: Windows release build and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
      - name: Portable package metadata, integrity and output safety
        shell: powershell
        run: |
          $commit = git rev-parse HEAD
          .\tests\windows_package.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-packaging-tests') -SourceCommit $commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-browser-windows-x64
          path: target/release/rust-browser.exe
          if-no-files-found: error

  # Single stable check name for branch protection if it is enabled later.
  result:
    name: CI result
    needs: [windows, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
