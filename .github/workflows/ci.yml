name: CI
# Validate pull requests and main. Feature-branch pushes no longer run a second,
# duplicate full validation: open a (draft) pull request to get CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR runs share a group so superseded pushes are cancelled. Every other run
  # (main pushes, manual dispatch) gets its own per-commit group: a shared group
  # would let GitHub drop a pending main run when a newer one queues.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  # Cheap Linux check that decides whether the Windows jobs are needed. Only a
  # change made entirely of unpackaged Markdown skips them; see .github/scripts/ci_scope.py.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the merge base of the whole pull request
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          # Whole pull request (base...head), or the commits a push to main added.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_scope.py scope

  # The portable core (and, once it exists, the Linux build) on Ubuntu with WebKitGTK.
  linux:
    name: Linux quality and tests
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libsecret-1-dev
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      # The .deb: built here, then installed into a clean Ubuntu container, so
      # its dependencies are the ones apt resolves, not this runner's.
      - run: cargo build --locked --release
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb --locked --no-build
      - name: Install the .deb on a clean Ubuntu 24.04
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c "
            apt-get update -q &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q desktop-file-utils /src/target/debian/*.deb &&
            sh /src/packaging/linux/check-installed.sh '$version'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # The Arch package from packaging/linux/arch/PKGBUILD, built from this commit
  # and installed in the same Arch container. Arch is rolling, so the image is
  # updated first rather than pinned.
  arch:
    name: Arch package
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: archlinux:base-devel
    steps:
      # Before checkout, which needs git for the tags pkgver() reads.
      - name: Update the image and install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pkgver() describes the commit from the last tag
      - name: Install the PKGBUILD's dependencies
        shell: bash
        run: |
          . packaging/linux/arch/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" desktop-file-utils
      - name: Build the package as an ordinary user
        run: |
          useradd -m builder
          git config --system --add safe.directory '*'
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "sh packaging/linux/arch/build-from-checkout.sh /home/builder/pkg"
      - name: Install and check the package
        run: |
          pacman -U --noconfirm /home/builder/pkg/rust-browser-git-*.pkg.tar.zst
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sh packaging/linux/check-installed.sh "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-arch-package
          path: /home/builder/pkg/rust-browser-git-*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows quality and build
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Caches the registry and compiled dependencies only (workspace crates are
      # rebuilt). Key includes OS, rustc version, Cargo.lock and this job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Experimental launcher safety and fixture tests (no Servo download)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\process_tree.ps1
          .\tests\servo_tools.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-servo-tests')
          python -m unittest discover -s experiments/servo -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Experimental fixture tests failed' }
          python -m unittest discover -s validation -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Production fixture handshake tests failed' }
      # Separate processes: winit permits one event loop per process. These reuse
      # the test binary built by `cargo test` above.
      - name: Native WebView2 isolation and permissions
        run: cargo test --locked --bin rust-browser native_private_storage_and_confirmed_engine_deletion -- --ignored --test-threads=1
      - name: Native application clearing
        run: cargo test --locked --bin rust-browser native_application_clear -- --ignored --test-threads=1
      - name: Native sleeping tabs and local new-tab boundary
        run: cargo test --locked --bin rust-browser native_tab_sleep_resume_and_local_page_security -- --ignored --test-threads=1
      - name: Private new-tab isolation
        run: cargo test --locked --bin rust-browser native_private_newtab_settings_are_ephemeral -- --ignored --test-threads=1
      - name: Native linked popups, media and upload protection
        run: cargo test --locked --bin rust-browser native_popup_opener_upload_audio_fullscreen_and_redirects -- --ignored --test-threads=1
      - name: Native renderer crash and reload recovery
        run: cargo test --locked --bin rust-browser native_renderer_crash_is_reported_and_reload_recovers -- --ignored --test-threads=1
      - name: Native failure reporting, tab retirement and engine restart
        run: cargo test --locked --bin rust-browser native_failure_reporting_tab_retirement_and_engine_restart -- --ignored --test-threads=1
      - name: Native toolbar engine failure recovery
        run: cargo test --locked --bin rust-browser native_toolbar_engine_failure_is_recovered -- --ignored --test-threads=1
      - name: Native toolbar keyboard reachability and scaled layout
        run: cargo test --locked --bin rust-browser native_toolbar_keyboard_reachability_and_scaled_layout -- --ignored --test-threads=1
      - name: Native content find, zoom, print and toolbar boundary
        run: cargo test --locked --bin rust-browser native_content_find_zoom_print_boundary -- --ignored --test-threads=1
      - name: Native private content tools and persistence boundary
        run: cargo test --locked --bin rust-browser native_private_content_tools_are_ephemeral -- --ignored --test-threads=1
      - name: Native address-field edit menu
        run: cargo test --locked --bin rust-browser native_address_field_edit_menu -- --ignored --test-threads=1
      - name: Native multiple windows, routing, limit, close, reopen and hand-off
        run: cargo test --locked --bin rust-browser native_multiple_windows_routing_limit_close_reopen_and_handoff -- --ignored --test-threads=1
      - name: Native multiple windows, engine restart, toolbar recovery and clearing
        run: cargo test --locked --bin rust-browser native_multiple_windows_engine_restart_toolbar_and_clearing -- --ignored --test-threads=1
      - name: Native multiple windows, restore and exit
        run: cargo test --locked --bin rust-browser native_multiple_windows_restore_and_exit -- --ignored --test-threads=1
      - name: Native password saving and autofill switches
        run: cargo test --locked --bin rust-browser native_passwords_and_autofill_follow_the_switches -- --ignored --test-threads=1
      - name: Native private windows never save passwords or forms
        run: cargo test --locked --bin rust-browser native_private_windows_never_save_passwords_or_forms -- --ignored --test-threads=1
      - name: Native bookmark import
        run: cargo test --locked --bin rust-browser native_bookmark_import_reaches_the_library -- --ignored --test-threads=1
      - name: Native toolbar autofill is cleared once on upgrade
        run: cargo test --locked --bin rust-browser native_toolbar_autofill_is_cleared_once_on_upgrade -- --ignored --test-threads=1
      - name: Native toolbar autofill cleanup does not repeat
        run: cargo test --locked --bin rust-browser native_toolbar_autofill_cleanup_does_not_repeat -- --ignored --test-threads=1
      - name: Native extensions add list disable remove and restart
        run: cargo test --locked --bin rust-browser native_extensions_add_list_disable_remove_and_restart -- --ignored --test-threads=1
      - name: Native private windows run extensions and the built-in blocker
        run: cargo test --locked --bin rust-browser native_private_windows_run_extensions_and_the_built_in_blocker -- --ignored --test-threads=1
      - name: Native built-in uBlock Origin
        run: cargo test --locked --bin rust-browser native_built_in_ublock_origin_blocks_and_turns_off -- --ignored --test-threads=1
      - name: Native address field Enter without a Go button
        run: cargo test --locked --bin rust-browser native_address_enter_navigates_without_a_go_button -- --ignored --test-threads=1
      - name: Native address suggestions
        run: cargo test --locked --bin rust-browser native_address_suggestions_complete_and_list -- --ignored --test-threads=1
      - name: Native toolbar polish states
        run: cargo test --locked --bin rust-browser native_toolbar_polish_states -- --ignored --test-threads=1
      - name: Native menu opens as a dropdown
        run: cargo test --locked --bin rust-browser native_menu_opens_as_a_dropdown -- --ignored --test-threads=1
      - name: Native menu keeps the new-tab page visible
        run: cargo test --locked --bin rust-browser native_menu_keeps_the_new_tab_page_visible -- --ignored --test-threads=1
      - name: Native back to the start of a new tab
        run: cargo test --locked --bin rust-browser native_back_to_the_start_of_a_new_tab_shows_the_new_tab_page -- --ignored --test-threads=1
      - name: Native new tabs grow into the tab strip
        run: cargo test --locked --bin rust-browser native_new_tabs_grow_into_the_tab_strip -- --ignored --test-threads=1
      - name: Native tab menu and middle-click
        run: cargo test --locked --bin rust-browser native_tab_menu_and_middle_click -- --ignored --test-threads=1
      - name: Native bookmarks bar
        run: cargo test --locked --bin rust-browser native_imported_bookmarks_show_on_the_bookmarks_bar -- --ignored --test-threads=1
      - name: Native bookmark menus
        run: cargo test --locked --bin rust-browser native_bookmark_menus -- --ignored --test-threads=1
      - name: Native window edges resize
        run: cargo test --locked --bin rust-browser native_window_edges_resize -- --ignored --test-threads=1
      - name: Native star and site information dropdowns
        run: cargo test --locked --bin rust-browser native_star_and_site_information_open_as_dropdowns -- --ignored --test-threads=1
      - name: Native permission request over the page
        run: cargo test --locked --bin rust-browser native_permission_prompt_over_the_page -- --ignored --test-threads=1
      - name: Native permission request over the page in a private window
        run: cargo test --locked --bin rust-browser native_private_permission_prompt_over_the_page -- --ignored --test-threads=1
      - name: Native menu keys, settings sections, confirmations and date filter
        run: cargo test --locked --bin rust-browser native_chrome_interactions -- --ignored --test-threads=1
      - name: Native library sidebar beside a live page
        run: cargo test --locked --bin rust-browser native_library_sidebar_beside_a_live_page -- --ignored --test-threads=1
      - name: Native shield counts what an extension blocks
        run: cargo test --locked --bin rust-browser native_shield_counts_what_an_extension_blocks -- --ignored --test-threads=1
      - name: Native shield opens the extension's own popup
        run: cargo test --locked --bin rust-browser native_shield_opens_the_extension_popup -- --ignored --test-threads=1
      - name: Native vertical tabs in two windows
        run: cargo test --locked --bin rust-browser native_vertical_tabs_in_two_windows -- --ignored --test-threads=1
      - name: Native new-tab tiles and background
        run: cargo test --locked --bin rust-browser native_newtab_tiles_and_background -- --ignored --test-threads=1
      - name: Native shield does not count frames from other sites
        run: cargo test --locked --bin rust-browser native_shield_does_not_count_frames_from_other_sites -- --ignored --test-threads=1
      - name: Native shield panel fits a narrow window
        run: cargo test --locked --bin rust-browser native_shield_panel_fits_a_narrow_window -- --ignored --test-threads=1
      - name: Native side columns have the toolbar restrictions and recover
        run: cargo test --locked --bin rust-browser native_side_views_have_the_toolbar_restrictions_and_recover -- --ignored --test-threads=1
      - name: Native private windows follow vertical tabs read-only
        run: cargo test --locked --bin rust-browser native_private_windows_follow_vertical_tabs_read_only -- --ignored --test-threads=1
      - name: Native profiles switch, add, edit and delete
        run: cargo test --locked --bin rust-browser native_profiles_switch_add_edit_and_delete -- --ignored --test-threads=1
      - name: Native single-instance hand-off between two browser processes
        run: cargo test --locked --test single_instance -- --ignored --test-threads=1
      - name: Controlled composition, scaling and frame comparison fixture
        run: cargo test --locked --bin rust-browser native_servo_comparison_fixture -- --ignored --test-threads=1 --nocapture
      - name: Native daily-driver compatibility, diagnostics and untrusted TLS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent fresh profiles; every run must pass. These are not retries.
          foreach ($attempt in 1..3) {
            .\validation\windows-daily.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP "rust-browser-daily-validation-$attempt")
          }
      - run: cargo build --locked

  # Independent of the quality job, so it runs in parallel on its own runner.
  release:
    name: Windows release build and package
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # exact pinned v0.22.2 upgrade fixture, never a mutable release download
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Old installer-fixture builds were nested in target and duplicated
          # in this cache. Start a separate production namespace after moving them.
          shared-key: v013-production-only
      - run: cargo build --locked --release
      - name: Portable package metadata, integrity and output safety
        shell: powershell
        run: |
          $commit = git rev-parse HEAD
          .\tests\windows_package.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-packaging-tests') -SourceCommit $commit
      - name: Cache immutable upgrade-fixture build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-browser-install-baseline/target-v022
          key: installer-fixture-v11-b4536e7063ba0860c64c7e1b0c6d2466df8313da-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - name: Installer lifecycle, profile preservation and artifact verification
        id: installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = .\packaging\windows\install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'rust-browser-inno')
          $baseline = .\tests\build_install_baseline.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-install-baseline')
          "Baseline build seconds: $($baseline.build_seconds)"
          $output = .\tests\windows_installer.ps1 -Executable target/release/rust-browser.exe -BaselineExecutable $baseline.executable -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-installer-tests') -Compiler $compiler -SourceCommit (git rev-parse HEAD)
          $package = $output | Where-Object { $_ -isnot [string] -and $_.metadata } | Select-Object -Last 1
          $output | Where-Object { $_ -is [string] }
          if (-not $package) { throw 'Installer tests returned no validated package' }
          .\tests\release_metadata.ps1 -MetadataPath $package.metadata -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-release-metadata')
          # Owner artifacts use a validation identity plus an explicit disposable
          # profile. Production CRT remains dynamic during the isolated experiment.
          .\tests\static_crt_build.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-crt-failure-tests')
          .\tests\owner_build.ps1 -Executable target/release/rust-browser.exe -OutputRoot (Join-Path $env:RUNNER_TEMP 'rust-browser-owner-tests') -Compiler $compiler -SourceCommit (git rev-parse HEAD) -ExpectedCrt dynamic
          "installer=$($package.installer)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.installer_checksum)" >> $env:GITHUB_OUTPUT
          "archive=$($package.archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.checksum)" >> $env:GITHUB_OUTPUT
          "metadata=$($package.metadata)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-windows-x64
          path: target/release/rust-browser.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-browser-windows-review-packages
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.installer_checksum }}
            ${{ steps.installer.outputs.archive }}
            ${{ steps.installer.outputs.checksum }}
            ${{ steps.installer.outputs.metadata }}
          if-no-files-found: error

  # Single stable check name for branch protection if it is enabled later. It
  # succeeds only if the scope check passed and every job it required passed; a
  # documentation-only change reports success with both Windows jobs skipped.
  result:
    name: CI result
    needs: [scope, windows, release, linux, arch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every needed CI job to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          WINDOWS: ${{ needs.windows.result }}
          RELEASE: ${{ needs.release.result }}
          LINUX: ${{ needs.linux.result }}
          ARCH: ${{ needs.arch.result }}
        run: python3 .github/scripts/ci_scope.py result "$SCOPE" "$FULL" "$WINDOWS" "$RELEASE" "$LINUX" "$ARCH"
