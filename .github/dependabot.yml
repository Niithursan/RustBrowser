version: 2
# Every Dependabot pull request costs a full Windows CI run, and so does every
# automatic rebase after main changes. Updates are therefore grouped into one pull
# request per ecosystem, checked monthly, and rebased only on request
# ("@dependabot rebase") when someone is ready to review them. See CI.md.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
