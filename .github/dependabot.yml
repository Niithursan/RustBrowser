version: 2
# Updates are grouped into one pull request per ecosystem and checked weekly.
# Automatic rebasing stays off: each rebase restarts the full Windows CI, so
# comment "@dependabot rebase" when ready to review. See CI.md.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
